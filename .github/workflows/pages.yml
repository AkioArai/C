# Пересобирает GitHub Pages после каждого пуска: пуши через приложения
# сами по себе сборку сайта не запускают.
name: Обновить сайт

on:
  push:
    branches: [main, claude/c-programming-visualization-i5855w]
  workflow_dispatch:

permissions:
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Запросить сборку GitHub Pages
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
